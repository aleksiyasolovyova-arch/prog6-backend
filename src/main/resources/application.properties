spring.application.name=KeepDishesGoing

# ========================================
# DataSource Configuration
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5443/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================
# Logging
# ========================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ========================================
# Event Listening and Monitoring
# ========================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=event-listener-

# ========================================
# RabbitMQ Config
# ========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.virtual-host=/


# ========================================
# Scheduling
# ========================================
spring.task.scheduling.thread-name-prefix=scheduler-

# ============================================================
# OAuth2 Resource Server (Keycloak)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/kdg
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/kdg/protocol/openid-connect/certs

# ============================================================
# Server Configuration
# ============================================================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/

# ============================================================
# Spring Security
# ============================================================
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
